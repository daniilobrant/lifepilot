name: Security checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lifepilot-audit"
          cd "$RUNNER_TEMP/lifepilot-audit"
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$asset" | sha256sum --check
          tar -xzf "$asset" gitleaks
          python -m venv semgrep-env
          semgrep-env/bin/python -m pip --disable-pip-version-check install --only-binary=:all: semgrep==1.186.0
          printf '%s\n' "$PWD" "$PWD/semgrep-env/bin" >> "$GITHUB_PATH"
      - name: Run security checks
        run: npm run security:check
      - name: Install locked LifePilot dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Run unit tests and TypeScript check
        run: |
          npm test
          ./node_modules/.bin/tsc --noEmit
      - name: Check HTTP permissions and agent isolation with empty profiles
        run: |
          mkdir -p dist
          ./node_modules/.bin/esbuild hub/ui/app.tsx --bundle --minify --outfile=dist/app.js
          trap './bin/lifepilot --trinity-audit stop || true; ./bin/lifepilot --acceptance stop || true; ./bin/lifepilot stop || true' EXIT
          ./bin/lifepilot start
          ./bin/lifepilot --acceptance start
          ./bin/lifepilot --trinity-audit start
          npm run test:integration
          node scripts/trinity-check.mjs
