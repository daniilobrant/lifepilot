name: Security checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install audit tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lifepilot-audit"
          cd "$RUNNER_TEMP/lifepilot-audit"
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$asset" | sha256sum --check
          tar -xzf "$asset" gitleaks
          python -m venv semgrep-env
          semgrep-env/bin/python -m pip --disable-pip-version-check install --only-binary=:all: semgrep==1.186.0
          printf '%s\n' "$PWD" "$PWD/semgrep-env/bin" >> "$GITHUB_PATH"
      - name: Run security checks
        run: npm run security:check
      - name: Install locked LifePilot dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Run unit tests and TypeScript check
        run: |
          npm test
          ./node_modules/.bin/tsc --noEmit
